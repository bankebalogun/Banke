name: Review Reminder Email

on:
  schedule:
    # GitHub's scheduled triggers on this repo have been observed firing
    # 3.5-4.5 hours late (documented best-effort behavior under load), so a
    # single fixed-time cron isn't reliable here. Running hourly and letting
    # the script accept a wide local-time window + a committed "already
    # sent today" state file is what actually gets an email out reliably.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send immediately regardless of local time (for testing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: content-automation
        run: npm install

      - name: Send review reminder
        working-directory: content-automation
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FORCE_SEND: ${{ inputs.force && 'true' || 'false' }}
        run: node scripts/send-review-reminder.js

      - name: Commit updated send-state
        run: |
          if [ -n "$(git status --porcelain content-automation/state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content-automation/state
            git commit -m "Record reminder send state [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No state change to commit."
          fi
